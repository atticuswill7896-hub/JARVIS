<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Command Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        body.raw-logs-hidden .raw-log-line {
            display: none;
        }
    </style>
</head>
<body class="h-full flex flex-col text-gray-100 font-sans antialiased">

    <!-- Top Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div id="status-indicator" class="w-3 h-3 bg-gray-500 rounded-full shadow-[0_0_8px_#6b7280]"></div>
            <h1 class="text-lg font-bold tracking-wider text-cyan-400">J.A.R.V.I.S. // WORKSTATION</h1>
        </div>
        
        <button id="admin-panel-btn" onclick="toggleAdminPanel()" 
                class="bg-gray-700 hover:bg-gray-600 text-cyan-400 border border-cyan-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
            Admin Panel
        </button>
    </header>

    <!-- Collapsible Admin Panel Drawer -->
    <div id="admin-panel" class="hidden bg-gray-800/95 border-b border-gray-700 px-4 py-3 text-xs">
        <div class="max-w-4xl mx-auto space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="text-gray-400 font-semibold">Quick Controls:</span>
                <div class="flex flex-wrap gap-2">
                    <button onclick="sendQuickCommand('Turn on built in LED')" class="bg-gray-700 hover:bg-cyan-700 text-gray-200 px-3 py-1.5 rounded transition">D1 LED ON</button>
                    <button onclick="sendQuickCommand('Turn off built in LED')" class="bg-gray-700 hover:bg-cyan-700 text-gray-200 px-3 py-1.5 rounded transition">D1 LED OFF</button>
                    <button onclick="sendQuickCommand('Toggle built in LED')" class="bg-gray-700 hover:bg-cyan-700 text-gray-200 px-3 py-1.5 rounded transition">D1 Toggle</button>
                    <button onclick="sendQuickCommand('Go to sleep')" class="bg-red-900/60 hover:bg-red-700 text-red-200 px-3 py-1.5 rounded transition">Sleep Mode</button>
                    <button onclick="sendQuickCommand('Wake up')" class="bg-green-900/60 hover:bg-green-700 text-green-200 px-3 py-1.5 rounded transition">Wake Up</button>
                    
                    <button id="toggle-raw-btn" onclick="toggleRawLogs()" 
                            class="bg-gray-700 hover:bg-gray-600 text-gray-400 border border-gray-600 px-3 py-1.5 rounded font-medium transition">
                        Raw Logs: OFF
                    </button>
                </div>
            </div>

            <div class="flex items-center space-x-2 pt-2 border-t border-gray-700">
                <span class="text-gray-400 font-semibold whitespace-nowrap">Trigger / Tag:</span>
                <input id="admin-trigger-input" type="text" placeholder="e.g. [PIN_ON(D7)] or [GET_WEATHER(Pendleton, OR)]" 
                       onkeydown="if(event.key === 'Enter') submitAdminTrigger()"
                       class="flex-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500">
                <button onclick="submitAdminTrigger()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-1.5 rounded font-medium transition">
                    Send Trigger
                </button>
            </div>
        </div>
    </div>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center text-xs font-bold text-white shadow">J</div>
            <div class="bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 max-w-[85%] sm:max-w-[75%] text-sm shadow-sm">
                <p class="leading-relaxed">System online. Click mic to enable wake-word listening ("Jarvis").</p>
                <span class="text-[10px] text-gray-500 mt-1 block">Just now</span>
            </div>
        </div>
    </main>

    <!-- Hidden audio element for speech streaming playback -->
    <audio id="jarvis-audio" style="display:none;"></audio>

    <!-- Input Footer Bar -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center space-x-2">
            <!-- Continuous Microphone Button Toggle -->
            <button id="mic-button" onclick="toggleContinuousMic()" title="Toggle Wake Word Listening" 
                    class="p-3 rounded-full bg-gray-700 hover:bg-gray-600 text-gray-300 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>

            <!-- Text Input -->
            <input id="chat-input" type="text" placeholder="Say 'Jarvis [command]' or type here..." 
                   onkeydown="if(event.key === 'Enter') submitMessage()"
                   class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">

            <!-- Send Button -->
            <button id="send-button" onclick="submitMessage()" 
                    class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-3 rounded-xl text-sm font-medium transition-all shadow hover:shadow-cyan-500/20 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                Send
            </button>
        </div>
    </footer>

    <script>
        const BACKEND_URL = 'https://atticus-hp-z240-tower-workstation.tail932b25.ts.net';

        let recognition = null;
        let isMicActive = false;
        let silenceTimer = null;
        let showRawLogs = false;
        const PAUSE_THRESHOLD_MS = 1500;

        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('raw-logs-hidden');
        });

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        function toggleRawLogs() {
            showRawLogs = !showRawLogs;
            const btn = document.getElementById('toggle-raw-btn');
            
            if (showRawLogs) {
                document.body.classList.remove('raw-logs-hidden');
                btn.textContent = 'Raw Logs: ON';
                btn.classList.remove('bg-gray-700', 'text-gray-400', 'border-gray-600');
                btn.classList.add('bg-cyan-900/60', 'text-cyan-200', 'border-cyan-500/40');
            } else {
                document.body.classList.add('raw-logs-hidden');
                btn.textContent = 'Raw Logs: OFF';
                btn.classList.remove('bg-cyan-900/60', 'text-cyan-200', 'border-cyan-500/40');
                btn.classList.add('bg-gray-700', 'text-gray-400', 'border-gray-600');
            }
        }

        function sendQuickCommand(cmdText) {
            const inputField = document.getElementById('chat-input');
            inputField.value = cmdText;
            submitMessage();
        }

        async function submitMessage(customText = null) {
            const inputField = document.getElementById('chat-input');
            const message = customText !== null ? customText : inputField.value.trim();
            if (!message) return;

            if (customText === null) {
                inputField.value = '';
            }
            appendMessage(message, 'user');

            try {
                const response = await fetch(`${BACKEND_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                appendMessage(data.reply || 'Command executed.', 'jarvis', data.raw_reply || '');

                // Only play audio if the microphone listening mode is currently active
                if (isMicActive) {
                    playLatestAudio();
                }

            } catch (error) {
                console.error('Error communicating with backend:', error);
                appendMessage('Error: Failed to reach J.A.R.V.I.S. backend workstation.', 'system');
            }
        }

        async function playLatestAudio() {
            try {
                const audioRes = await fetch(`${BACKEND_URL}/get-audio`);
                if (audioRes.ok) {
                    const blob = await audioRes.blob();
                    const audioUrl = URL.createObjectURL(blob);
                    const audioElement = document.getElementById('jarvis-audio');
                    audioElement.src = audioUrl;
                    audioElement.play().catch(e => console.log("Audio autoplay prevented by browser:", e));
                }
            } catch (e) {
                console.error("Failed to fetch audio stream:", e);
            }
        }

        function submitAdminTrigger() {
            const triggerInput = document.getElementById('admin-trigger-input');
            const triggerText = triggerInput.value.trim();
            if (!triggerText) return;
            
            triggerInput.value = '';
            submitMessage(triggerText);
        }

        function appendMessage(text, sender, rawReply = '') {
            const container = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 ${sender === 'user' ? 'justify-end' : ''}`;

            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (sender === 'user') {
                messageDiv.innerHTML = `
                    <div class="bg-cyan-700 text-white rounded-2xl px-4 py-3 max-w-[85%] sm:max-w-[75%] text-sm shadow-sm">
                        <p class="leading-relaxed">${escapeHtml(text)}</p>
                        <span class="text-[10px] text-cyan-200 mt-1 block text-right">${timeString}</span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-xs font-bold text-white shadow">U</div>
                `;
            } else {
                let rawHtml = '';
                if (rawReply) {
                    rawHtml = `<div class="raw-log-line text-[11px] text-gray-400/60 font-mono mb-1.5 pb-1 border-b border-gray-700/50 select-all">RAW: ${escapeHtml(rawReply)}</div>`;
                }

                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center text-xs font-bold text-white shadow">J</div>
                    <div class="bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 max-w-[85%] sm:max-w-[75%] text-sm shadow-sm">
                        ${rawHtml}
                        <p class="leading-relaxed">${escapeHtml(text)}</p>
                        <span class="text-[10px] text-gray-500 mt-1 block">${timeString}</span>
                    </div>
                `;
            }

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function toggleContinuousMic() {
            if (!isMicActive) {
                startMicSession();
            } else {
                stopMicSession();
            }
        }

        function startMicSession() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isMicActive = true;
                const micButton = document.getElementById('mic-button');
                const indicator = document.getElementById('status-indicator');
                
                micButton.classList.add('bg-red-600', 'text-white', 'shadow-[0_0_12px_#dc2626]');
                micButton.classList.remove('bg-gray-700', 'text-gray-300');
                
                indicator.classList.remove('bg-gray-500', 'shadow-[0_0_8px_#6b7280]');
                indicator.classList.add('bg-cyan-400', 'animate-pulse', 'shadow-[0_0_8px_#22d3ee]');
            };

            recognition.onresult = (event) => {
                let spokenText = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    spokenText += event.results[i][0].transcript;
                }
                spokenText = spokenText.trim();

                const inputField = document.getElementById('chat-input');
                if (inputField) {
                    inputField.value = spokenText;
                }

                // Check if spoken text contains "jarvis" (case-insensitive wake word)
                const lowerText = spokenText.toLowerCase();
                if (lowerText.includes("jarvis")) {
                    // Extract command part after "jarvis"
                    const parts = lowerText.split("jarvis");
                    const commandPart = parts[parts.length - 1].trim();

                    clearTimeout(silenceTimer);
                    if (commandPart.length > 0) {
                        silenceTimer = setTimeout(() => {
                            triggerAutoSend(commandPart);
                        }, PAUSE_THRESHOLD_MS);
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                if (event.error === 'not-allowed') {
                    alert("Microphone permission denied. Please allow mic access in your browser settings.");
                    stopMicSession();
                }
            };

            recognition.onend = () => {
                if (isMicActive) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error("Restart failed:", e);
                    }
                }
            };

            try {
                recognition.start();
            } catch (err) {
                console.error("Could not start recognition:", err);
            }
        }

        function stopMicSession() {
            isMicActive = false;
            clearTimeout(silenceTimer);
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            const micButton = document.getElementById('mic-button');
            const indicator = document.getElementById('status-indicator');
            
            micButton.classList.remove('bg-red-600', 'text-white', 'shadow-[0_0_12px_#dc2626]');
            micButton.classList.add('bg-gray-700', 'text-gray-300');
            
            indicator.classList.remove('bg-cyan-400', 'animate-pulse', 'shadow-[0_0_8px_#22d3ee]');
            indicator.classList.add('bg-gray-500', 'shadow-[0_0_8px_#6b7280]');
        }

        function triggerAutoSend(messageText) {
            clearTimeout(silenceTimer);
            const inputField = document.getElementById('chat-input');
            if (inputField) inputField.value = messageText;
            submitMessage();
        }
    </script>
</body>
</html>
