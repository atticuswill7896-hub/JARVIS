<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S.</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0f19" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; display: flex; flex-direction: column; height: 100dvh; }
    
    header { background: #111827; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; color: #38bdf8; margin: 0 auto; }
    
    #admin-toggle { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    #admin-toggle.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .msg-container { display: flex; flex-direction: column; max-width: 85%; width: fit-content; }
    .msg-container.user { align-self: flex-end; }
    .msg-container.bot { align-self: flex-start; }

    .msg { padding: 12px 16px; border-radius: 14px; line-height: 1.4; font-size: 15px; word-wrap: break-word; }
    .user .msg { background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
    .bot .msg { background: #1e293b; color: #f8fafc; border-bottom-left-radius: 2px; border: 1px solid #334155; }

    /* Semi-transparent raw output overlay */
    .raw-overlay {
      display: none;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      white-space: pre-wrap;
      word-break: break-all;
      backdrop-filter: blur(4px);
    }
    .admin-mode .raw-overlay { display: block; }

    #input-area { display: flex; gap: 8px; padding: 12px; background: #111827; border-top: 1px solid #1e293b; }
    input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    
    button.action-btn { background: #0284c7; color: white; border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    button.action-btn:hover { background: #0369a1; }
    button.recording { background: #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <header>
    <div style="width: 60px;"></div> <!-- Spacer for centering -->
    <h1>J.A.R.V.I.S.</h1>
    <button id="admin-toggle" title="Toggle Raw Groq Terminal">Admin</button>
  </header>

  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="text-input" placeholder="Message or command..." autocomplete="off" />
    <button id="mic-btn" class="action-btn" title="Voice Input">🎤</button>
    <button id="send-btn" class="action-btn" title="Send">➤</button>
  </div>

  <script>
    const BASE_URL = "https://atticus-hp-z240-tower-workstation.tail932b25.ts.net";
    const chatBox = document.getElementById("chat-box");
    const textInput = document.getElementById("text-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const adminToggle = document.getElementById("admin-toggle");

    // Toggle Admin Mode
    let adminMode = false;
    adminToggle.addEventListener("click", () => {
      adminMode = !adminMode;
      adminToggle.classList.toggle("active", adminMode);
      chatBox.classList.toggle("admin-mode", adminMode);
    });

    function appendMessage(text, sender, rawText = "") {
      const container = document.createElement("div");
      container.className = `msg-container ${sender}`;

      if (sender === "bot") {
        const rawOverlay = document.createElement("div");
        rawOverlay.className = "raw-overlay";
        rawOverlay.textContent = rawText || "[No raw output recorded]";
        container.appendChild(rawOverlay);
      }

      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";
      msgDiv.textContent = text;
      container.appendChild(msgDiv);

      chatBox.appendChild(container);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage(text, isVoice = false) {
      if (!text.trim()) return;
      appendMessage(text, "user");
      textInput.value = "";

      try {
        const res = await fetch(`${BASE_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: text })
        });
        const data = await res.json();
        
        // reply is the clean spoken text, rawReply (if sent) is the raw groq output
        const cleanReply = data.reply || data.response || "No response received.";
        const rawReply = data.raw_reply || cleanReply; // Fallback if backend hasn't split them yet

        appendMessage(cleanReply, "bot", rawReply);

        if (isVoice) {
          playTTS(cleanReply);
        }
      } catch (err) {
        appendMessage("Connection error: Could not reach workstation.", "bot", "ERROR: Fetch failed.");
      }
    }

    async function playTTS(text) {
      try {
        const res = await fetch(`${BASE_URL}/speak`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play();
      } catch (err) {
        console.error("TTS playback failed:", err);
      }
    }

    sendBtn.addEventListener("click", () => sendMessage(textInput.value, false));
    textInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage(textInput.value, false);
    });

    // Browser Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      micBtn.addEventListener("click", () => {
        micBtn.classList.add("recording");
        recognition.start();
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        sendMessage(transcript, true);
      };

      recognition.onend = () => micBtn.classList.remove("recording");
      recognition.onerror = () => micBtn.classList.remove("recording");
    } else {
      micBtn.style.display = "none";
    }
  </script>
</body>
</html>
