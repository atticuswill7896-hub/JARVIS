<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S.</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0f19" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; display: flex; flex-direction: column; height: 100dvh; }
    header { background: #111827; padding: 16px; text-align: center; font-weight: 700; letter-spacing: 2px; color: #38bdf8; border-bottom: 1px solid #1e293b; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 14px; line-height: 1.4; font-size: 15px; word-wrap: break-word; }
    .user { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #1e293b; color: #f8fafc; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    #input-area { display: flex; gap: 8px; padding: 12px; background: #111827; border-top: 1px solid #1e293b; }
    input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { background: #0284c7; color: white; border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button.recording { background: #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <header>J.A.R.V.I.S.</header>
  <div id="chat-box"></div>
  <div id="input-area">
    <input type="text" id="text-input" placeholder="Message or command..." autocomplete="off" />
    <button id="mic-btn" title="Voice Input">🎤</button>
    <button id="send-btn" title="Send">➤</button>
  </div>

  <script>
    // Use your permanent Tailscale Funnel URL or localhost for testing
    const BASE_URL = "https://atticus-hp-z240-tower-workstation.tail932b25.ts.net";
    const chatBox = document.getElementById("chat-box");
    const textInput = document.getElementById("text-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage(text, isVoice = false) {
      if (!text.trim()) return;
      appendMessage(text, "user");
      textInput.value = "";

      try {
        const res = await fetch(`${BASE_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: text })
        });
        const data = await res.json();
        const reply = data.reply || data.response || "No response received.";
        appendMessage(reply, "bot");

        if (isVoice) {
          playTTS(reply);
        }
      } catch (err) {
        appendMessage("Connection error: Could not reach workstation.", "bot");
      }
    }

    async function playTTS(text) {
      try {
        const res = await fetch(`${BASE_URL}/speak`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play();
      } catch (err) {
        console.error("TTS playback failed:", err);
      }
    }

    sendBtn.addEventListener("click", () => sendMessage(textInput.value, false));
    textInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage(textInput.value, false);
    });

    // Browser Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      micBtn.addEventListener("click", () => {
        micBtn.classList.add("recording");
        recognition.start();
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        sendMessage(transcript, true);
      };

      recognition.onend = () => micBtn.classList.remove("recording");
      recognition.onerror = () => micBtn.classList.remove("recording");
    } else {
      micBtn.style.display = "none";
    }
  </script>
</body>
</html>
